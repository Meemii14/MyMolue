<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyMolue — Move your way</title>
  <meta name="description" content="MyMolue — a Nigerian ride-hailing platform built around negotiated fares and shared rides.">
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f8fafc}
    *{box-sizing:border-box}body{margin:0}.wrap{min-height:100vh;display:grid;place-items:center;padding:32px;background:radial-gradient(circle at top,#e7f8ef 0,#f8fafc 48%)}
    .card{width:min(720px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:28px;padding:48px;box-shadow:0 20px 60px rgba(16,24,40,.08)}
    .brand{font-size:20px;font-weight:800;letter-spacing:-.03em}.pill{display:inline-block;margin-top:40px;padding:8px 12px;border-radius:999px;background:#ecfdf3;color:#067647;font-size:13px;font-weight:700}
    h1{font-size:clamp(42px,7vw,72px);line-height:.98;letter-spacing:-.06em;margin:18px 0}.lead{font-size:18px;line-height:1.6;color:#475467;max-width:590px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{display:inline-block;padding:14px 20px;border-radius:12px;text-decoration:none;font-weight:700}.primary{background:#111827;color:#fff}.secondary{border:1px solid #d0d5dd;color:#344054}.note{margin-top:28px;color:#667085;font-size:13px}
  </style>
</head>
<body><main class="wrap"><section class="card"><div class="brand">MyMolue</div><span class="pill">Built for Nigeria</span><h1>Move your way.</h1><p class="lead">Negotiate your fare. Find a driver. Share a ride when it makes sense. MyMolue is being built as a flexible Nigerian ride-hailing platform.</p><div class="actions"><a class="btn primary" href="/app">Launch app</a><a class="btn secondary" href="https://github.com/Meemii14/MyMolue">View project</a></div><p class="note">The production API is being connected separately from this Netlify-hosted web layer.</p></section></main></body></html>
