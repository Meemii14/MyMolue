{% extends 'base.html' %}{% block content %}<div class="card auth"><h1>Create your account</h1><form method="post"><label>Full name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Phone<input name="phone" required></label><label>Password<input type="password" name="password" minlength="6" required></label><label>Account type<select name="role"><option value="rider">Rider</option><option value="driver">Driver</option></select></label><button class="btn" type="submit">Create account</button></form></div>{% endblock %}
